# Config exercising command_context: every command is wrapped as
#   <command_context> sh -c 'cd <release> && <run>'
# `env` is a transparent passthrough available in the container, so it proves
# the wrapping round-trips through the real remote shell without changing the
# result. Commands use only POSIX-sh builtins (cd, pwd, test) so the test
# asserts the wrapping mechanics without depending on the remote PATH.
# The per-command empty override forces one command back onto the host.
composer: composer.json
rsync_src: ./
keep_releases: 10

# Deny-by-default allowlist: the commands below run `test -f composer.json` in
# the release, so composer.json must be deployed.
include:
  - composer.json

command_context: env

hosts:
  production:
    hostname: 127.0.0.1
    remote_user: root
    deploy_path: /var/www/html
    port: 2424
    ssh_key: ../ssh_keys/shippy_key
    ssh_multiplexing: false

shared:
  - .env
  - var/log/
  - var/session/
  - public/fileadmin/
  - public/uploads/

commands:
  # Wrapped in the context: proves `cd` happens inside the context and the
  # single-quote escaping for `sh -c` is correct (a failing cd or bad quoting
  # would make the deploy fail).
  - name: Confirm release directory inside context
    run: test -f composer.json && pwd

  # Same, forced back onto the host with an empty per-command override.
  - name: Confirm release directory on host
    run: test -f composer.json && pwd
    command_context: ""
