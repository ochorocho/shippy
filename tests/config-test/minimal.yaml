# Deny-by-default allowlist: without an include nothing is deployed.
include:
  - public/
  - composer.json
hosts:
  production:
    hostname: 127.0.0.1
    remote_user: root
    deploy_path: /var/www/html
    # optional but required for testing
    ssh_key: ../ssh_keys/shippy_key
    ssh_options:
      StrictHostKeyChecking: yes
    port: 2424
